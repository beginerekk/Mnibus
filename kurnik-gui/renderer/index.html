<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Kurnik</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0c0e13;
  --bg1:      #111318;
  --bg2:      #171921;
  --bg3:      #1e2129;
  --bg4:      #262930;
  --line:     #2a2d35;
  --line2:    #353840;
  --t0:       #eceef2;
  --t1:       #8b90a0;
  --t2:       #4a4f60;
  --acc:      #e8c547;
  --acc2:     #c9a72e;
  --acc-dim:  #2a2410;
  --green:    #4ade80;
  --red:      #f87171;
  --blue:     #60a5fa;
  --mono:     'JetBrains Mono', monospace;
  --head:     'Syne', sans-serif;
}

html, body { height: 100%; background: var(--bg); color: var(--t0); font-family: var(--mono); font-size: 13px; overflow: hidden; user-select: none; }

/* ── TITLEBAR DRAG REGION ── */
#drag { height: 36px; -webkit-app-region: drag; background: var(--bg1); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 14px; gap: 10px; }
#drag .wordmark { font-family: var(--head); font-weight: 800; font-size: 15px; letter-spacing: .04em; color: var(--acc); -webkit-app-region: no-drag; }
#drag .conn-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--t2); margin-left: 10px; }
#drag .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t2); transition: background .3s, box-shadow .3s; }
#drag .conn-dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
#drag .conn-dot.connecting { background: var(--acc); animation: blink .7s infinite; }
#drag .drag-spacer { flex: 1; }
#drag .disc-btn { -webkit-app-region: no-drag; font-family: var(--mono); font-size: 10px; padding: 3px 10px; background: transparent; border: 1px solid var(--line2); color: var(--t2); cursor: pointer; letter-spacing: .06em; display: none; }
#drag .disc-btn:hover { border-color: var(--red); color: var(--red); }
#drag .disc-btn.show { display: block; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── LAYOUT ── */
#app { height: calc(100vh - 36px); display: flex; }

/* ══════════════════════════════════════
   SCREEN: CONNECT
══════════════════════════════════════ */
#screen-connect {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  background-image: radial-gradient(ellipse 60% 40% at 50% 50%, #1a1c22 0%, var(--bg) 100%);
}
.connect-box {
  width: 460px;
  background: var(--bg1);
  border: 1px solid var(--line);
  padding: 32px;
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
}
.connect-box h1 { font-family: var(--head); font-size: 22px; font-weight: 800; letter-spacing: .03em; color: var(--acc); margin-bottom: 4px; }
.connect-box .sub { font-size: 11px; color: var(--t2); margin-bottom: 28px; letter-spacing: .06em; text-transform: uppercase; }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--t2); margin-bottom: 6px; }
.field input {
  width: 100%; background: var(--bg0, #0c0e13); border: 1px solid var(--line); color: var(--t0);
  font-family: var(--mono); font-size: 13px; padding: 10px 12px; outline: none;
  transition: border-color .15s;
}
.field input:focus { border-color: var(--acc); }

/* GAME GRID */
.game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 18px; }
.game-opt {
  padding: 8px 4px; text-align: center; cursor: pointer; font-size: 11px; letter-spacing: .04em;
  background: var(--bg2); border: 1px solid var(--line); color: var(--t2);
  transition: all .15s;
}
.game-opt:hover { background: var(--bg3); color: var(--t1); }
.game-opt.active { background: var(--acc-dim); border-color: var(--acc); color: var(--acc); }

.connect-btn {
  width: 100%; padding: 12px; font-family: var(--head); font-size: 14px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
  background: var(--acc); color: var(--bg); border: none;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  transition: background .15s;
}
.connect-btn:hover { background: var(--acc2); }
.connect-btn:disabled { background: var(--bg4); color: var(--t2); cursor: default; }

.err-msg { margin-top: 12px; font-size: 11px; color: var(--red); text-align: center; min-height: 16px; }

/* ══════════════════════════════════════
   SCREEN: MAIN (tables + chat)
══════════════════════════════════════ */
#screen-main { flex: 1; display: none; overflow: hidden; }
#screen-main.show { display: flex; }

/* SIDEBAR: tables */
#sidebar {
  width: 260px; min-width: 260px; background: var(--bg1);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-hdr {
  padding: 12px 14px 8px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-hdr-title { font-family: var(--head); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--t1); flex: 1; }
.table-count { font-size: 10px; background: var(--bg3); border: 1px solid var(--line2); color: var(--t2); padding: 2px 7px; }

#tables-list { flex: 1; overflow-y: auto; }
#tables-list::-webkit-scrollbar { width: 4px; }
#tables-list::-webkit-scrollbar-thumb { background: var(--bg4); }

.table-row {
  padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line);
  transition: background .1s; border-left: 2px solid transparent;
}
.table-row:hover { background: var(--bg2); }
.table-row.active { background: var(--bg2); border-left-color: var(--acc); }
.table-row.occupied .tr-players { color: var(--green); }
.tr-id { font-size: 10px; color: var(--t2); margin-bottom: 3px; font-family: var(--mono); }
.tr-params { font-size: 11px; color: var(--t1); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-players { font-size: 11px; color: var(--t2); font-family: var(--mono); }

.sidebar-footer { padding: 10px 14px; border-top: 1px solid var(--line); }
.obs-btn {
  width: 100%; padding: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
  cursor: pointer; background: var(--bg3); border: 1px solid var(--line2); color: var(--t1);
  transition: all .15s;
}
.obs-btn:hover { border-color: var(--blue); color: var(--blue); }

/* CHAT AREA */
#chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.chat-topbar {
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: var(--bg1); display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.chat-topbar-title { font-family: var(--head); font-size: 14px; font-weight: 700; color: var(--t0); flex: 1; }
.chat-topbar-sub { font-size: 11px; color: var(--t2); font-family: var(--mono); }
.table-badge {
  padding: 3px 10px; font-size: 11px; font-family: var(--mono);
  background: var(--acc-dim); border: 1px solid var(--acc); color: var(--acc);
  display: none;
}
.table-badge.show { display: block; }

/* MESSAGES */
#messages {
  flex: 1; overflow-y: auto; padding: 12px 16px; background: var(--bg);
  display: flex; flex-direction: column; gap: 2px;
}
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-thumb { background: var(--bg4); }

.msg {
  display: flex; gap: 10px; padding: 3px 8px; border-radius: 0;
  transition: background .1s; line-height: 1.6;
}
.msg:hover { background: rgba(255,255,255,.02); }
.msg-time { font-size: 10px; color: var(--t2); flex-shrink: 0; padding-top: 1px; width: 54px; }
.msg-body { flex: 1; font-size: 12px; word-break: break-word; }
.msg.chat    .msg-body { color: var(--t0); }
.msg.system  .msg-body { color: var(--t2); font-style: italic; }
.msg.system  .msg-time { color: var(--t2); opacity: .6; }
.msg.notice  .msg-body { color: var(--acc); }
.msg.err     .msg-body { color: var(--red); }
.msg.ok      .msg-body { color: var(--green); }

/* INPUT BAR */
.input-bar {
  display: flex; gap: 0; border-top: 1px solid var(--line);
  background: var(--bg1); flex-shrink: 0;
}
#chat-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: var(--mono); font-size: 13px; color: var(--t0);
  padding: 12px 14px;
}
#chat-input::placeholder { color: var(--t2); }
#chat-input:disabled { opacity: .4; cursor: not-allowed; }
.send-btn {
  padding: 0 20px; background: var(--acc-dim); border: none; border-left: 1px solid var(--line);
  color: var(--acc); font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  cursor: pointer; transition: background .15s;
}
.send-btn:hover { background: #3a3010; }
.send-btn:disabled { opacity: .3; cursor: not-allowed; }

/* status bar */
#status-bar {
  padding: 4px 16px; background: var(--bg1); border-top: 1px solid var(--line);
  font-size: 10px; color: var(--t2); font-family: var(--mono); letter-spacing: .04em; flex-shrink: 0;
}

/* LOADING OVERLAY */
#loading {
  position: fixed; inset: 0; background: rgba(12,14,19,.9);
  display: none; place-items: center; z-index: 50; flex-direction: column; gap: 14px;
}
#loading.show { display: flex; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--line2); border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-family: var(--head); font-size: 13px; color: var(--t1); letter-spacing: .06em; }
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="drag">
  <div class="wordmark">KURNIK</div>
  <div class="conn-indicator">
    <div class="conn-dot" id="conn-dot"></div>
    <span id="conn-label">rozłączony</span>
  </div>
  <div class="drag-spacer"></div>
  <button class="disc-btn" id="disc-btn" onclick="doDisconnect()">ROZŁĄCZ</button>
</div>

<div id="app">

  <!-- ── SCREEN: CONNECT ── -->
  <div id="screen-connect">
    <div class="connect-box">
      <h1>Kurnik.pl</h1>
      <div class="sub">klient desktopowy</div>

      <div class="field">
        <label>Wybierz grę</label>
        <div class="game-grid" id="game-grid"></div>
      </div>

      <div class="field">
        <label>Numer pokoju</label>
        <input type="number" id="room-input" placeholder="np. 100, 200, 300..." min="1" />
      </div>

      <button class="connect-btn" id="connect-btn" onclick="doConnect()">POŁĄCZ</button>
      <div class="err-msg" id="err-msg"></div>
    </div>
  </div>

  <!-- ── SCREEN: MAIN ── -->
  <div id="screen-main">
    <div id="sidebar">
      <div class="sidebar-hdr">
        <div class="sidebar-hdr-title">Stoły</div>
        <div class="table-count" id="table-count">0</div>
      </div>
      <div id="tables-list"></div>
      <div class="sidebar-footer">
        <button class="obs-btn" onclick="joinObserver()">👁 Tryb obserwatora</button>
      </div>
    </div>

    <div id="chat-area">
      <div class="chat-topbar">
        <div>
          <div class="chat-topbar-title" id="chat-title">Wybierz stół</div>
          <div class="chat-topbar-sub" id="chat-sub">—</div>
        </div>
        <div class="table-badge" id="table-badge"></div>
      </div>
      <div id="messages"></div>
      <div class="input-bar">
        <input id="chat-input" placeholder="Wpisz wiadomość... (Enter aby wysłać)" disabled />
        <button class="send-btn" id="send-btn" onclick="sendMsg()" disabled>WYŚLIJ</button>
      </div>
      <div id="status-bar" id="status-bar">Połącz się i wybierz stół aby zacząć</div>
    </div>
  </div>

</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-txt" id="loading-txt">Łączenie...</div>
</div>

<script>
// ── STAN ──────────────────────────────────────────────
let selectedGame = 'szachy';
let games = {};
let connected = false;
let currentTableId = 0;
let tables = [];

// ── INIT ──────────────────────────────────────────────
(async () => {
  games = await window.kurnik.getGames();
  buildGameGrid();
  setupListeners();

  document.getElementById('room-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doConnect();
  });
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });
})();

// ── GAME GRID ─────────────────────────────────────────
function buildGameGrid() {
  const grid = document.getElementById('game-grid');
  grid.innerHTML = Object.entries(games).map(([key, name]) =>
    `<div class="game-opt ${key===selectedGame?'active':''}" onclick="selectGame('${key}')">${name}</div>`
  ).join('');
}
function selectGame(key) {
  selectedGame = key;
  document.querySelectorAll('.game-opt').forEach(el => el.classList.toggle('active', el.textContent === games[key]));
}

// ── IPC LISTENERS ─────────────────────────────────────
function setupListeners() {
  window.kurnik.onWsStatus(({ connected: c, code }) => {
    connected = c;
    setConnDot(c ? 'on' : 'off');
    document.getElementById('conn-label').textContent = c ? 'połączono' : 'rozłączony';
    document.getElementById('disc-btn').classList.toggle('show', c);
    hideLoading();
    if (c) {
      showMain();
      addMsg('system', `Połączono z pokojem`);
      setStatus('Połączono · wybierz stół z listy po lewej');
    } else {
      addMsg('err', `Rozłączono (kod ${code})`);
      disableChat();
    }
  });

  window.kurnik.onWsError(({ message }) => {
    hideLoading();
    showErr(message);
    addMsg('err', 'Błąd WS: ' + message);
  });

  window.kurnik.onSessionResult(({ ok }) => {
    if (!ok) {
      hideLoading();
      showErr('Nie udało się uzyskać sesji (brak cookie kt=)');
    } else {
      setLoadingTxt('Łączenie z WS...');
      setConnDot('connecting');
    }
  });

  window.kurnik.onTables((t) => {
    tables = t;
    renderTables(t);
    document.getElementById('table-count').textContent = t.length;
    addMsg('notice', `Załadowano ${t.length} stołów · kliknij aby dołączyć`);
    setStatus(`${t.length} stołów dostępnych`);
  });

  window.kurnik.onMessage(({ type, text, code }) => {
    const cls = type === 'chat' ? 'chat' : 'system';
    addMsg(cls, text);
  });
}

// ── CONNECT ───────────────────────────────────────────
async function doConnect() {
  const room = document.getElementById('room-input').value.trim();
  if (!room || !/^\d+$/.test(room)) { showErr('Podaj poprawny numer pokoju'); return; }
  clearErr();
  showLoading('Pobieranie sesji...');
  setConnDot('connecting');
  document.getElementById('connect-btn').disabled = true;
  const result = await window.kurnik.connect({ game: selectedGame, room });
  if (!result.ok) {
    hideLoading();
    showErr(result.error);
    document.getElementById('connect-btn').disabled = false;
    setConnDot('off');
  }
}

async function doDisconnect() {
  await window.kurnik.disconnect();
  connected = false;
  currentTableId = 0;
  tables = [];
  setConnDot('off');
  document.getElementById('conn-label').textContent = 'rozłączony';
  document.getElementById('disc-btn').classList.remove('show');
  document.getElementById('screen-connect').style.display = 'flex';
  document.getElementById('screen-main').classList.remove('show');
  document.getElementById('connect-btn').disabled = false;
  disableChat();
}

// ── TABLES ────────────────────────────────────────────
function renderTables(t) {
  const list = document.getElementById('tables-list');
  if (!t.length) {
    list.innerHTML = '<div style="padding:14px;font-size:11px;color:var(--t2);text-align:center">Brak stołów w tym pokoju</div>';
    return;
  }
  list.innerHTML = t.map(tbl => {
    const hasPlayers = tbl.players && tbl.players.trim();
    return `<div class="table-row ${hasPlayers?'occupied':''}" onclick="joinTable(${tbl.id}, '${esc(tbl.params)}', '${esc(tbl.players)}')">
      <div class="tr-id">STÓŁ #${tbl.id}</div>
      <div class="tr-params">${tbl.params || '—'}</div>
      <div class="tr-players">${tbl.players || 'wolny'}</div>
    </div>`;
  }).join('');
}

async function joinTable(id, params, players) {
  document.querySelectorAll('.table-row').forEach(r => r.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const res = await window.kurnik.joinTable({ tableId: id });
  if (res.ok) {
    currentTableId = id;
    document.getElementById('chat-title').textContent = `Stół #${id}`;
    document.getElementById('chat-sub').textContent = params || '';
    document.getElementById('table-badge').textContent = `STÓŁ ${id}`;
    document.getElementById('table-badge').classList.add('show');
    enableChat();
    addMsg('ok', `Dołączono do stołu #${id} · ${players || 'brak graczy'}`);
    setStatus(`Stół #${id} · ${params}`);
  } else {
    addMsg('err', 'Nie można dołączyć: ' + res.error);
  }
}

function joinObserver() {
  currentTableId = 0;
  document.getElementById('chat-title').textContent = 'Obserwator';
  document.getElementById('chat-sub').textContent   = 'tryb tylko do odczytu';
  document.getElementById('table-badge').classList.remove('show');
  document.querySelectorAll('.table-row').forEach(r => r.classList.remove('active'));
  disableChat();
  addMsg('notice', 'Tryb obserwatora — wiadomości widoczne, czat wyłączony');
  setStatus('Obserwator · pokój aktywny');
}

// ── CHAT ──────────────────────────────────────────────
async function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (text.startsWith('/join ')) {
    const id = parseInt(text.slice(6), 10);
    if (!isNaN(id)) await window.kurnik.joinTable({ tableId: id });
    return;
  }
  const res = await window.kurnik.sendChat({ text });
  if (res.ok) {
    addMsg('chat', 'TY: ' + text);
  } else {
    addMsg('err', res.error);
  }
}

function enableChat() {
  document.getElementById('chat-input').disabled  = false;
  document.getElementById('send-btn').disabled    = false;
  document.getElementById('chat-input').focus();
}
function disableChat() {
  document.getElementById('chat-input').disabled  = true;
  document.getElementById('send-btn').disabled    = true;
}

// ── MESSAGES ──────────────────────────────────────────
function addMsg(type, text) {
  const box  = document.getElementById('messages');
  const now  = new Date().toLocaleTimeString('pl', { hour12: false });
  const div  = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = `<span class="msg-time">${now}</span><span class="msg-body">${esc(text)}</span>`;
  box.appendChild(div);
  if (box.scrollTop + box.clientHeight > box.scrollHeight - 80) box.scrollTop = box.scrollHeight;
}

// ── UI HELPERS ────────────────────────────────────────
function showMain() {
  document.getElementById('screen-connect').style.display = 'none';
  document.getElementById('screen-main').classList.add('show');
}
function showLoading(txt) {
  document.getElementById('loading-txt').textContent = txt;
  document.getElementById('loading').classList.add('show');
}
function setLoadingTxt(t) { document.getElementById('loading-txt').textContent = t; }
function hideLoading()    { document.getElementById('loading').classList.remove('show'); }
function setConnDot(state) {
  const d = document.getElementById('conn-dot');
  d.className = 'conn-dot' + (state === 'on' ? ' on' : state === 'connecting' ? ' connecting' : '');
}
function setStatus(t) { document.getElementById('status-bar').textContent = t; }
function showErr(msg)  { document.getElementById('err-msg').textContent = msg; }
function clearErr()    { document.getElementById('err-msg').textContent = ''; }
function esc(s)        { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
