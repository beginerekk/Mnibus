<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Kurnik GUI</title>
  <link rel="stylesheet" href="/src/style.css"/>
</head>
<body>
  <div id="app">

    <!-- ── SIDEBAR ── -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="logo">🎮 Kurnik</span>
        <button id="btn-new-bot" title="Nowy bot">＋</button>
      </div>
      <ul id="bot-list"></ul>
    </aside>

    <!-- ── MAIN ── -->
    <main id="main">

      <!-- Widok startowy -->
      <div id="view-welcome" class="view active">
        <div class="welcome-box">
          <div class="welcome-icon">🎲</div>
          <h2>Dodaj bota</h2>
          <p>Kliknij <strong>＋</strong> w panelu bocznym,<br>aby uruchomić nowe połączenie.</p>
        </div>
      </div>

      <!-- Widok nowego bota (formularz) -->
      <div id="view-new-bot" class="view">
        <div class="form-card">
          <h2>Nowy bot</h2>
          <label>Gra
            <select id="sel-game">
              <option value="szachy">Szachy</option>
              <option value="warcaby">Warcaby</option>
              <option value="kalambury">Kalambury</option>
              <option value="literaki">Literaki</option>
              <option value="chinczyk">Chińczyk</option>
              <option value="go">Go</option>
              <option value="backgammon">Backgammon</option>
              <option value="reversi">Reversi</option>
              <option value="brydz">Brydż</option>
              <option value="kierki">Kierki</option>
              <option value="remik">Remik</option>
              <option value="hex">Hex</option>
              <option value="gomoku">Gomoku</option>
              <option value="bierki">Bierki</option>
            </select>
          </label>
          <label>Pokój
            <input id="inp-room" type="number" placeholder="np. 100" min="1"/>
          </label>
          <div class="form-actions">
            <button id="btn-cancel-new" class="btn-ghost">Anuluj</button>
            <button id="btn-connect"    class="btn-primary">Połącz</button>
          </div>
        </div>
      </div>

      <!-- Widok bota: lobby + chat -->
      <div id="view-bot" class="view">

        <div id="bot-topbar">
          <span id="bot-title"></span>
          <span id="bot-badge" class="badge offline">offline</span>
          <button id="btn-stop-bot" class="btn-danger" title="Rozłącz">✕</button>
        </div>

        <div id="bot-body">

          <!-- LOBBY -->
          <section id="panel-lobby">
            <div class="panel-header">Stoły</div>
            <div id="table-list-wrap">
              <table id="table-list">
                <thead><tr><th>ID</th><th>Parametry</th><th>Gracze</th><th></th></tr></thead>
                <tbody id="table-tbody"></tbody>
              </table>
              <div id="lobby-empty" class="empty-hint">Oczekiwanie na listę stołów…</div>
            </div>
          </section>

          <!-- CHAT -->
          <section id="panel-chat">
            <div class="panel-header">
              Chat
              <span id="chat-table-label"></span>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-row">
              <input id="chat-input" type="text" placeholder="Wpisz wiadomość…" disabled/>
              <button id="btn-send" disabled>↵</button>
            </div>
          </section>

        </div>
      </div>

    </main>
  </div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
