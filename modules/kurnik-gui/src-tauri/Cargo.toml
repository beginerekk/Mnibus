[package]
name    = "kurnik-gui"
version = "0.1.0"
edition = "2021"

[lib]
name         = "kurnik_gui_lib"
crate-type   = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kurnik-gui"
path = "src/main.rs"

[dependencies]
tauri          = { version = "2", features = ["rustls-tls"] }
tauri-plugin-shell = { version = "2" }
tokio          = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
reqwest        = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
futures-util   = "0.3"
dashmap        = "6"
once_cell      = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["rustls-tls"] }
